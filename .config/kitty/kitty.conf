# you can choose themes from $HOME/.config/kitty/kitty-themes/

# font_family FantasqueSansM Nerd Font Mono Bold
# font_family Perfect DOS VGA 437
# font_family Fira Code
# font_family monospace
# font_family Martian Mono
# font_family JetBrains Nerd Font
# font_family FreeMono
# font_family Fetamont Script
font_family Adwaita Mono
font_size 15.0
bold_font auto
italic_font auto
bold_italic_font auto

# background_opacity 0.90
background_opacity 1.00
dynamic_background_opacity 1
confirm_os_window_close -1 # ask if any program is running otherwise just close

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 20000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd

scrollback_lines 10000

remember_window_size  yes

foreground #ebdbb2
background #272727
selection_foreground #655b53
selection_background #ebdbb2
url_color #d65c0d

# term xterm-256color
term xterm-kitty

tab_bar_edge bottom

tab_bar_margin_width 1

tab_bar_style powerline

tab_bar_align left

tab_switch_strategy previous

tab_separator " ┇"

tab_powerline_style angled

tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5 
map alt+shift+6 goto_tab 6
map alt+shift+7 goto_tab 7
map alt+shift+8 goto_tab 8
map alt+shift+9 goto_tab 9
map alt+shift+0 goto_tab 10

# to hide windows decorations (will also hide borders)
# hide_window_decorations yes 


# black
color0   #2f2f2f
color8   #656565

# red
color1   #d75f5f
color9   #d75f5f

# green
color2    #d4d232
color10   #8fee96

# yellow
color3    #af865a
color11   #cd950c

# blue
color4   #22c3a1
color12  #22c3a1

# magenta
color5   #775759
color13  #775759

# cyan
color6   #84edb9
color14  #84edb9

# white
color7   #c0b18b
color15  #d8d8d8

enable_audio_bell no

modify_font cell_height 125%

# remaps
map ctrl+shift+t new_tab_with_cwd
