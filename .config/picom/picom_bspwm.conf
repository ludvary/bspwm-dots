#  picom_bspwm.conf · gruvbox bspwm rice

backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;

# shadows
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.42;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-color = "#0d0f0f";

# fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# corners
corner-radius = 4;

# blur
blur-method = "dual_kawase";
blur-strength = 9;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# per-window rules
rules = (
  # # windows are opaque; unfocused ones just dim a touch
  # { match = "window_type = 'normal' && !focused"; dim = 0.06; },

  # # you had thunar slightly see-through
  # { match = "class_g = 'Thunar'"; opacity = 0.94; },
  # every window slightly see-through, a bit more when unfocused
  { match = "window_type = 'normal'"; opacity = 0.92; },
  { match = "window_type = 'normal' && !focused"; opacity = 0.86; dim = 0.04; },

  # media, browsers, readers and games stay solid
  { match = "class_g = 'org.mozilla.firefox' || class_g = 'code' || class_g = 'Code' || class_i = 'Navigator' || class_g = 'mpv' || class_g = 'vlc' || class_g = 'Chromium-browser' || class_g = 'org.pwmt.zathura' || class_g = 'Zathura' || class_g = 'okular' || class_g = 'skyrimse.exe' || class_g *= 'Minecraft' || class_g = 'com.mojang.minecraft' || class_g = 'loupe' || class_g = 'kitty' || class_g = 'emacs' || class_g = 'Emacs' || class_g = 'Opera'"; opacity = 1; dim = 0; },

  # menus / tooltips
  { match = "window_type = 'tooltip'"; opacity = 0.96; corner-radius = 8; full-shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.97; corner-radius = 8; },

  # docks / desktop
  { match = "window_type = 'dock' || window_type = 'desktop'"; corner-radius = 0; blur-background = false; },
  { match = "window_type = 'dock'"; shadow = false; clip-shadow-above = true; },
  { match = "window_type = 'dnd'"; shadow = false; },

  # no shadows for these (from your old config)
  { match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || class_g = 'soffice' || class_g = 'LibreOffice' || class_g = 'Grace' || _GTK_FRAME_EXTENTS@:c"; shadow = false; },

  # no blur behind these
  { match = "class_g = 'org.mozilla.firefox' || class_i = 'Navigator' || _GTK_FRAME_EXTENTS@:c"; blur-background = false; },

  # eww bars: match their rounded boxes
  { match = "class_g = 'Eww'"; corner-radius = 14; },

  # fullscreen: square corners, no dim
  { match = "fullscreen"; corner-radius = 0; dim = 0; opacity = 1},

  #  dunst, slide in from the right edge
  { match = "class_g = 'Dunst'";
    corner-radius = 12;
    animations = (
      {
        triggers = ["open", "show"];
        opacity  = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.35; start = 0; end = "window-raw-opacity"; };
        offset-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.35; start = 60; end = 0; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        shadow-offset-x = "offset-x";
      },
      {
        triggers = ["close", "hide"];
        opacity  = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = "window-raw-opacity-before"; end = 0; };
        offset-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = 0; end = 40; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        shadow-offset-x = "offset-x";
      }
    );
  },

  # workspace slide, FORWARD (going to a higher desktop)
  # change the 1920 number if your resolution differs
  { match = "_BSPWM_SLIDE:32c = 1";
    animations = (
      {
        triggers = ["hide"];
        offset-x = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.32; start = 0; end = -1920; };
        shadow-offset-x = "offset-x";
      },
      {
        triggers = ["show"];
        offset-x = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.32; start = 1920; end = 0; };
        shadow-offset-x = "offset-x";
      }
    );
  },

  # workspace slide, BACKWARD (going to a lower desktop)
  { match = "_BSPWM_SLIDE:32c = 0";
    animations = (
      {
        triggers = ["hide"];
        offset-x = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.32; start = 0; end = 1920; };
        shadow-offset-x = "offset-x";
      },
      {
        triggers = ["show"];
        offset-x = { curve = "cubic-bezier(0.25, 1, 0.5, 1)"; duration = 0.32; start = -1920; end = 0; };
        shadow-offset-x = "offset-x";
      }
    );
  }
);

# default animations for every window
animations = (
  # open: fade + gentle grow from 92%
  {
    triggers = ["open"];
    opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.28; start = 0; end = "window-raw-opacity"; };
    scale-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.28; start = 0.92; end = 1; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # close: quick fade + slight shrink
  {
    triggers = ["close"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.18; start = "window-raw-opacity-before"; end = 0; };
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.18; start = 1; end = 0.94; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # show/hide without a slide tag (eg sending a window away) soft fade
  {
    triggers = ["show"];
    opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.2; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },
  {
    triggers = ["hide"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.15; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },

  # tiling changes
  {
    triggers = ["geometry"];
    scale-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = "window-width-before / window-width"; end = 1; };
    scale-y = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = "window-height-before / window-height"; end = 1; };
    offset-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = "window-x-before - window-x"; end = 0; };
    offset-y = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = "window-y-before - window-y"; end = 0; };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);
